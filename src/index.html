<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fog Shader — Caminata en el anillo brumoso</title>
  <meta name="description" content="Escena 3D en el navegador: una cámara camina en bucle por un camino circular mientras los árboles y rocas aparecen y desaparecen en la niebla.">
  <meta name="theme-color" content="#cdd6e4">

  <script language="javascript" type="text/javascript" src="libraries/p5.min.js?v=2"></script>
  <!-- scripts se cargan en orden de dependencias -->
  <script language="javascript" type="text/javascript" src="config.js?v=10"></script>
  <script language="javascript" type="text/javascript" src="fog.js?v=4"></script>
  <script language="javascript" type="text/javascript" src="textures.js?v=5"></script>
  <script language="javascript" type="text/javascript" src="entities.js?v=6"></script>
  <script language="javascript" type="text/javascript" src="ui.js?v=3"></script>
  <script language="javascript" type="text/javascript" src="main.js?v=10"></script>

  <style>
    html, body {
      padding: 0;
      margin: 0;
      overscroll-behavior: none;
    }

    canvas {
      display: block;
      touch-action: none;
      transform: scaleY(-1);
    }

    #fog-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 220px;
      padding: 12px 14px;
      background: rgba(20, 26, 38, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      user-select: none;
    }

    #fog-panel .fog-panel-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    #fog-panel label {
      display: block;
      margin-top: 8px;
    }

    #fog-panel input[type="range"] {
      width: 100%;
      margin-top: 4px;
      cursor: pointer;
    }

    #fog-panel .fog-val {
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 480px) {
      #fog-panel {
        width: calc(100vw - 32px);
        max-width: 240px;
        font-size: 12px;
      }
    }
  </style>

</head>

<body>
</body>
</html>
